<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Chrome Shine -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Shield / Circle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" filter="url(#glow)" />

  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Center Shield -->
  <path d="M 256 100 L 360 145 C 360 260 256 340 256 370 C 256 340 152 260 152 145 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Hammer & Wrench Crossed -->
  <!-- Wrench (Diagonal left to right) -->
  <g transform="rotate(45 256 240)">
    <!-- Handle -->
    <rect x="242" y="140" width="28" height="200" rx="8" fill="url(#silverGrad)" stroke="#64748b" stroke-width="3" />
    <!-- Wrench Head Top -->
    <path d="M 230 140 C 230 110 282 110 282 140 L 268 152 L 244 152 Z" fill="url(#silverGrad)" stroke="#64748b" stroke-width="3" />
    <!-- Wrench Head Bottom -->
    <circle cx="256" cy="335" r="22" fill="url(#silverGrad)" stroke="#64748b" stroke-width="3" />
    <circle cx="256" cy="335" r="10" fill="#0f172a" />
  </g>

  <!-- Hammer (Diagonal right to left) -->
  <g transform="rotate(-45 256 240)">
    <!-- Handle -->
    <rect x="244" y="150" width="24" height="190" rx="6" fill="url(#goldGrad)" stroke="#b45309" stroke-width="3" />
    <rect x="242" y="270" width="28" height="65" rx="5" fill="#334155" />
    <!-- Hammer Head -->
    <rect x="206" y="130" width="100" height="36" rx="6" fill="url(#silverGrad)" stroke="#64748b" stroke-width="3" />
    <path d="M 206 130 L 186 120 L 186 176 L 206 166 Z" fill="url(#silverGrad)" stroke="#64748b" stroke-width="3" />
  </g>

  <!-- Center Golden Star / Gear Spark -->
  <circle cx="256" cy="240" r="26" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" />
  
  <!-- Subtle Egyptian Motif / Golden Wings Base -->
  <path d="M 190 395 Q 256 425 322 395" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="415" r="7" fill="#fbbf24" />
</svg>
