<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<title>Atari Breakout 3D - لعبه هدم الجدران اتاري قديم بريك أوت</title>
<meta name="description" content="العب لعبه هدم الجدران اتاري قديم بريك أوت ثلاثية الأبعاد الكلاسيكية مجاناً وبدون تحميل! تحكم بالمضرب والكرة ودمّر طوب الجدار الملون مع الهدايا والمغناطيس." />
<meta name="keywords" content="Atari Breakout, لعبة بريك اوت, هدم الجدران أتاري, العاب كلاسيكية ثلاثية الابعاد, العب الان" />

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030612;
    touch-action:none;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select:none;
    -webkit-user-select:none;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    z-index:10;
    top:max(
        12px,
        env(safe-area-inset-top)
    );
    left:50%;
    transform:translateX(-50%);
    width:min(
        720px,
        90vw
    );
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:10px 18px;
    border:
        1px solid
        rgba(255,255,255,.12);
    border-radius:16px;
    background:
        rgba(5,12,35,.82);
    backdrop-filter:
        blur(12px);
    box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);
}

.stat{
    text-align:center;
    min-width:70px;
}

.stat small{
    display:block;
    color:#8795b7;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
}

.stat b{
    font-size:18px;
    font-weight: 800;
}

#score{
    color:#00e5ff;
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
}

#level{
    color:#ffd43b;
    text-shadow: 0 0 10px rgba(255, 212, 59, 0.4);
}

#lives{
    color:#ff5577;
    text-shadow: 0 0 10px rgba(255, 85, 119, 0.4);
    letter-spacing: 2px;
}

#top-controls {
    display: flex;
    gap: 8px;
}

.control-btn {
    width: 38px;
    height: 38px;
    border: 
        1px solid
        rgba(255,255,255,.15);
    border-radius: 50%;
    background:
        rgba(5,12,35,.85);
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.control-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: scale(1.05);
}

.control-btn:active {
    transform: scale(0.95);
}

#power{
    position:fixed;
    z-index:12;
    bottom:max(
        16px,
        env(safe-area-inset-bottom)
    );
    left:50%;
    transform:translateX(-50%);
    padding:8px 18px;
    border-radius:999px;
    background:
        rgba(5,12,35,.88);
    border:
        1px solid
        rgba(255,255,255,.15);
    font-size:13px;
    font-weight: bold;
    opacity:0;
    transition:.2s;
    pointer-events: none;
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
}

#power.show{
    opacity:1;
}

#overlay{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        rgba(0,0,0,.7);
    backdrop-filter:
        blur(10px);
}

.panel{
    width:min(
        460px,
        92vw
    );
    padding:35px 25px;
    text-align:center;
    border-radius:24px;
    background:
        linear-gradient(
            145deg,
            #111d3e,
            #070b1b
        );
    border:
        1px solid
        rgba(255,255,255,.15);
    box-shadow:
        0 25px 80px
        rgba(0,0,0,.65);
}

.logo{
    font-size:
        clamp(
            38px,
            10vw,
            58px
        );
    font-weight:900;
    letter-spacing:-2px;
    color:white;
    text-shadow:
        0 0 10px #00e5ff,
        0 0 30px
        rgba(0,229,255,.6);
    margin-bottom: 15px;
}

.panel p{
    color:#b1bdd7;
    line-height:1.7;
    font-size:14px;
    margin:12px 0;
}

.start{
    border:0;
    border-radius:999px;
    padding:14px 35px;
    background:
        linear-gradient(
            135deg,
            #00e5ff,
            #147cff
        );
    color:#001018;
    font-size:18px;
    font-weight:900;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
    transition: all 0.2s;
}

.start:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 229, 255, 0.6);
}

.start:active {
    transform: translateY(0);
}

.tip{
    color:#687696 !important;
    font-size:11px !important;
    margin-top: 15px !important;
}

.hidden{
    display:none !important;
}

/* Pause screen */
#pause-overlay {
    position: fixed;
    inset: 0;
    z-index: 18;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

#pause-overlay h2 {
    font-size: 36px;
    color: #ffd43b;
    text-shadow: 0 0 15px rgba(255, 212, 59, 0.5);
    margin-bottom: 10px;
}

#pause-overlay p {
    color: #94a3b8;
    font-size: 14px;
}

@media
(max-height:520px)
and
(orientation:landscape){
    #hud{
        top:5px;
        padding:5px 12px;
    }
    .stat b{
        font-size:14px;
    }
    .stat small{
        font-size:8px;
    }
}

</style>
</head>


<body>

<div id="game"></div>

<!-- ================= HUD ================= -->
<div id="hud">
    <div class="stat">
        <small id="label-score">النقاط</small>
        <b id="score">0</b>
    </div>

    <div class="stat">

    <div class="stat">
        <small id="label-lives">المحاولات</small>

    <div id="top-controls">

</div>

<!-- ================= START SCREEN ================= -->
<div id="overlay">
    <div class="panel">
        <div class="logo">BREAKOUT 3D</div>
        
        <p id="message">

            <br>

<script type="module">

/* =========================================================
   THREE.JS
========================================================= */
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================================================
   MULTILINGUAL SUPPORT
========================================================= */
// Read ?lang=en or ?lang=ar (default is Arabic based on layout)
const urlParams = new URLSearchParams(window.location.search);
const lang = urlParams.get('lang') || 'ar';
const isRtl = lang === 'ar';

document.documentElement.lang = lang;
document.documentElement.dir = isRtl ? 'rtl' : 'ltr';

const LOCALIZATION = {
    ar: {
        score: "النقاط",
        level: "المستوى",
        lives: "المحاولات",
        instructions: "🖐️ اسحب بإصبعك يميناً ويساراً لتحريك المضرب.<br>لا تحتاج للضغط المستمر. اضغط P للإيقاف مؤقتاً.",
        powers: "🟦 طوبة تكبّر المضرب<br>🧲 طوبة مغناطيسية تمسك الكرة",
        btnStart: "ابدأ اللعبة 🎮",
        btnRestart: "إعادة اللعب 🔄",
        tip: "تعمل على الهاتف والتابلت والكمبيوتر",
        powerWide: "🟦 مضرب كبير ",
        powerMagnet: "🧲 مغناطيس ",
        seconds: "ث",
        gameOver: "انتهت اللعبة!",
        finalScore: "النتيجة النهائية: ",
        beatenRecord: "حاول تحطيم رقمك القياسي!",
        paused: "تم الإيقاف مؤقتاً",
        resumeTip: "اضغط على زر الإيقاف مؤقتاً أو اضغط P للاستئناف"
    },
    en: {
        score: "Score",
        level: "Level",
        lives: "Lives",
        instructions: "🖐️ Swipe left and right to control the paddle.<br>No need to hold down. Press P to Pause.",
        powers: "🟦 Wide power-up brick<br>🧲 Magnetic power-up brick",
        btnStart: "Start Game 🎮",
        btnRestart: "Play Again 🔄",
        tip: "Works on Mobile, Tablet & Desktop",
        powerWide: "🟦 Wide Paddle ",
        powerMagnet: "🧲 Magnetic ",
        seconds: "s",
        gameOver: "GAME OVER",
        finalScore: "Final Score: ",
        beatenRecord: "Try to beat your high score!",
        paused: "GAME PAUSED",
        resumeTip: "Tap Pause button or press P to resume"
    }
};

const t = LOCALIZATION[lang] || LOCALIZATION.ar;

// Apply initial translations
document.getElementById('label-score').textContent = t.score;
document.getElementById('label-level').textContent = t.level;
document.getElementById('label-lives').textContent = t.lives;
document.getElementById('message').innerHTML = t.instructions;
document.getElementById('powers-info').innerHTML = t.powers;
document.getElementById('start').textContent = t.btnStart;
document.getElementById('device-info').textContent = t.tip;
document.getElementById('pause-title').textContent = t.paused;
document.getElementById('pause-subtitle').textContent = t.resumeTip;


/* =========================================================
   AUDIO
========================================================= */
let audioContext = null;
let audioEnabled = true;

function initAudio(){
    if(!audioContext){
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioContext.state === "suspended"){
        audioContext.resume();
    }
}

function sound(frequency, duration, type="sine", volume=.04, endFrequency=null){
    if(!audioEnabled) return;
    try {
        initAudio();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);

        if(endFrequency){
            oscillator.frequency.exponentialRampToValueAtTime(
                Math.max(30, endFrequency),
                audioContext.currentTime + duration
            );
        }

        gain.gain.setValueAtTime(volume, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + duration);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
    } catch(e) {}
}

function soundPaddle(){ sound(240, .07, "square", .035, 340); }
function soundWall(){ sound(120, .05, "triangle", .025, 80); }
function soundBrick(){ sound(420, .08, "square", .045, 240); }
function soundWide(){
    sound(350, .12, "sine", .06, 900);
    setTimeout(() => sound(700, .12, "sine", .04, 1100), 70);
}
function soundMagnet(){
    sound(180, .15, "sawtooth", .035, 650);
    setTimeout(() => sound(700, .15, "sine", .04, 350), 90);
}
function soundRelease(){ sound(650, .12, "square", .045, 950); }
function soundLose(){ sound(180, .35, "sawtooth", .05, 50); }
function soundLevel(){
    sound(500, .12, "square", .04, 900);
    setTimeout(() => sound(800, .18, "square", .04, 1300), 120);
}
function soundStart(){
    sound(330, .1, "square", .035, 500);
    setTimeout(() => sound(550, .18, "square", .04, 900), 100);
}

/* =========================================================
   CONTROLS SETUP
========================================================= */
const soundButton = document.getElementById("sound");
soundButton.onclick = () => {
    audioEnabled = !audioEnabled;
    soundButton.textContent = audioEnabled ? "🔊" : "🔇";
    if(audioEnabled){
        initAudio();
        soundStart();
    }
};

const pauseButton = document.getElementById("pause");
pauseButton.onclick = () => {
    togglePause();
};

/* =========================================================
   GAME CONFIG
========================================================= */
const WORLD_WIDTH = 18;
const WORLD_HEIGHT = 12;
const ROWS = 6;
const COLS = 9;
const BRICK_WIDTH = 1.58;
const BRICK_HEIGHT = .53;
const BRICK_GAP = .12;
const BASE_PADDLE_WIDTH = 3;
const BALL_RADIUS = .28;

/* =========================================================
   GAME VARIABLES
========================================================= */
let score = 0;
let level = 1;
let lives = 3;
let running = false;
let isPaused = false;

let paddleWidth = BASE_PADDLE_WIDTH;
let wideTimer = 0;
let magnetTimer = 0;
let magnetAttached = false;

let bricks = [];
let particles = [];
let ballTrailParticles = []; // For the premium ball vapor trail

let keyboardLeft = false;
let keyboardRight = false;

/* =========================================================
   THREE SCENE
========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030612);

const camera = new THREE.OrthographicCamera(-10, 10, 7, -7, .1, 100);
camera.position.z = 20;

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById("game").appendChild(renderer.domElement);

/* =========================================================
   LIGHT
========================================================= */
scene.add(new THREE.AmbientLight(0xffffff, .75));

const pointLight = new THREE.PointLight(0x00e5ff, 5, 35);
pointLight.position.set(0, 5, 8);
scene.add(pointLight);

/* =========================================================
   ARENA
========================================================= */
const arena = new THREE.Mesh(
    new THREE.BoxGeometry(WORLD_WIDTH, WORLD_HEIGHT, .35),
    new THREE.MeshStandardMaterial({
        color:0x0c1530,
        metalness:.3,
        roughness:.5
    })
);
arena.position.z = -1;
scene.add(arena);

/* =========================================================
   WALLS
========================================================= */
function createWall(x, y, width, height){
    const wall = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, .5),
        new THREE.MeshStandardMaterial({
            color:0x14234b,
            emissive:0x06265a,
            emissiveIntensity:1
        })
    );
    wall.position.set(x, y, 0);
    scene.add(wall);
}

createWall(-WORLD_WIDTH/2-.28, 0, .56, WORLD_HEIGHT);
createWall(WORLD_WIDTH/2+.28, 0, .56, WORLD_HEIGHT);
createWall(0, WORLD_HEIGHT/2+.28, WORLD_WIDTH+1.1, .56);

/* =========================================================
   PADDLE
========================================================= */
const paddle = new THREE.Mesh(
    new THREE.BoxGeometry(BASE_PADDLE_WIDTH, .42, .6),
    new THREE.MeshStandardMaterial({
        color:0x00e5ff,
        emissive:0x006f8c,
        emissiveIntensity:1.25,
        metalness:.35,
        roughness:.2
    })
);
paddle.position.set(0, -WORLD_HEIGHT/2+1, .5);
scene.add(paddle);

/* =========================================================
   BALL
========================================================= */
const ball = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_RADIUS, 22, 22),
    new THREE.MeshStandardMaterial({
        color:0xffffff,
        emissive:0x00e5ff,
        emissiveIntensity:2
    })
);
scene.add(ball);

/* =========================================================
   BALL VELOCITY
========================================================= */
const velocity = new THREE.Vector2(4.2, 5.1);

/* =========================================================
   CHANGE PADDLE SIZE
========================================================= */
function setPaddleWidth(width){
    paddleWidth = width;
    paddle.geometry.dispose();
    paddle.geometry = new THREE.BoxGeometry(paddleWidth, .42, .6);
}

/* =========================================================
   BRICKS
========================================================= */
const brickColors = [
    0xff3864,
    0xff7a00,
    0xffcf33,
    0x39e75f,
    0x00d9ff,
    0x9b5cff
];

function createBricks(){
    bricks.forEach(brick => scene.remove(brick.mesh));
    bricks = [];

    const totalWidth = COLS * BRICK_WIDTH + (COLS-1) * BRICK_GAP;
    const startX = -totalWidth/2 + BRICK_WIDTH/2;
    const startY = 4;

    for(let row=0; row<ROWS; row++){
        for(let col=0; col<COLS; col++){
            let type = "normal";
            const random = Math.random();

            if(random < .09){
                type = "wide";
            } else if(random < .17){
                type = "magnet";
            }

            let color;
            if(type === "wide"){
                color = 0x00aaff;
            } else if(type === "magnet"){
                color = 0xc04cff;
            } else {
                color = brickColors[row % brickColors.length];
            }

            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(BRICK_WIDTH, BRICK_HEIGHT, .55),
                new THREE.MeshStandardMaterial({
                    color:color,
                    emissive:color,
                    emissiveIntensity: type === "normal" ? .18 : .6,
                    metalness:.2,
                    roughness:.35
                })
            );

            mesh.position.set(
                startX + col * (BRICK_WIDTH + BRICK_GAP),
                startY - row * (BRICK_HEIGHT + BRICK_GAP),
                .3
            );

            scene.add(mesh);
            bricks.push({
                mesh:mesh,
                type:type,
                alive:true
            });
        }
    }
}

/* =========================================================
   RESET BALL
========================================================= */
function resetBall(){
    ball.position.set(0, -2, .7);
    const speed = 5.1 + level * .4;
    const angle = (Math.random() * .55 + .3) * (Math.random() < .5 ? -1 : 1);

    velocity.set(
        speed * Math.sin(angle),
        Math.abs(speed * Math.cos(angle))
    );

    magnetAttached = false;
}

/* =========================================================
   RESET ROUND
========================================================= */
function resetRound(){
    setPaddleWidth(BASE_PADDLE_WIDTH);
    wideTimer = 0;
    resetBall();
    updateHUD();
}

/* =========================================================
   HUD
========================================================= */
const scoreElement = document.getElementById("score");
const levelElement = document.getElementById("level");
const livesElement = document.getElementById("lives");
const powerElement = document.getElementById("power");

function updateHUD(){
    scoreElement.textContent = score;
    levelElement.textContent = level;
    livesElement.textContent = "❤️".repeat(lives) + "🖤".repeat(3-lives);

    if(wideTimer > 0){
        powerElement.textContent = t.powerWide + Math.ceil(wideTimer) + t.seconds;
        powerElement.classList.add("show");
    } else if(magnetTimer > 0){
        powerElement.textContent = t.powerMagnet + Math.ceil(magnetTimer) + t.seconds;
        powerElement.classList.add("show");
    } else {
        powerElement.classList.remove("show");
    }
}

/* =========================================================
   PAUSE MECHANICS
========================================================= */
function togglePause() {
    if(!running) return;
    isPaused = !isPaused;
    const pauseOverlay = document.getElementById("pause-overlay");
    if (isPaused) {
        pauseOverlay.classList.remove("hidden");
        document.getElementById("pause").textContent = "▶️";
    } else {
        pauseOverlay.classList.add("hidden");
        document.getElementById("pause").textContent = "⏸️";
    }
}

/* =========================================================
   PARTICLES EXPLOSION
========================================================= */
function createParticles(position, color){
    for(let i=0; i<12; i++){
        const particle = new THREE.Mesh(
            new THREE.SphereGeometry(.045, 6, 6),
            new THREE.MeshBasicMaterial({
                color:color,
                transparent: true,
                opacity: 0.9
            })
        );

        particle.position.copy(position);
        scene.add(particle);

        particles.push({
            mesh:particle,
            velocity: new THREE.Vector3(
                (Math.random()-.5) * 4.5,
                (Math.random()-.5) * 4.5,
                (Math.random()-.5) * 2
            ),
            life:.6
        });
    }
}

/* =========================================================
   PREMIUM BALL VAPOR TRAIL
========================================================= */
function updateBallTrail(delta) {
    if (magnetAttached || isPaused) return;

    // Spawn 1 trail particle every frame-step
    const trailGeom = new THREE.SphereGeometry(BALL_RADIUS * 0.7, 8, 8);
    const trailMat = new THREE.MeshBasicMaterial({
        color: 0x00e5ff,
        transparent: true,
        opacity: 0.4
    });
    const trailMesh = new THREE.Mesh(trailGeom, trailMat);
    trailMesh.position.copy(ball.position);
    scene.add(trailMesh);

    ballTrailParticles.push({
        mesh: trailMesh,
        life: 0.25 // seconds of duration
    });
}

function processBallTrail(delta) {
    for (let i = ballTrailParticles.length - 1; i >= 0; i--) {
        const item = ballTrailParticles[i];
        item.life -= delta;
        item.mesh.scale.setScalar(Math.max(0, item.life * 4));
        item.mesh.material.opacity = Math.max(0, item.life * 1.6);

        if (item.life <= 0) {
            scene.remove(item.mesh);
            item.mesh.geometry.dispose();
            item.mesh.material.dispose();
            ballTrailParticles.splice(i, 1);
        }
    }
}

/* =========================================================
   COLLISION ALGORITHM
========================================================= */
function circleRectangleCollision(
    circleX,
    circleY,
    radius,
    rectangleX,
    rectangleY,
    rectangleWidth,
    rectangleHeight
){
    const closestX = Math.max(
        rectangleX - rectangleWidth/2,
        Math.min(circleX, rectangleX + rectangleWidth/2)
    );

    const closestY = Math.max(
        rectangleY - rectangleHeight/2,
        Math.min(circleY, rectangleY + rectangleHeight/2)
    );

    const dx = circleX - closestX;
    const dy = circleY - closestY;

    return (dx*dx + dy*dy) <= radius*radius;
}

/* =========================================================
   HIT BRICK
========================================================= */
function hitBrick(brick){
    brick.alive = false;
    brick.mesh.visible = false;
    score += 10 * level;

    createParticles(brick.mesh.position, brick.mesh.material.color);
    soundBrick();

    if(brick.type === "wide"){
        setPaddleWidth(Math.min(5.2, paddleWidth + 1.25));
        wideTimer = 12;
        soundWide();
    }

    if(brick.type === "magnet"){
        magnetTimer = 12;
        soundMagnet();
    }

    updateHUD();

    if(bricks.every(brick => !brick.alive)){
        level++;
        soundLevel();
        createBricks();
        resetRound();
    }
}

/* =========================================================
   RELEASE MAGNET
========================================================= */
function releaseMagnet(){
    if(!magnetAttached){
        return;
    }

    magnetAttached = false;
    const speed = Math.max(5.2, velocity.length());
    const offset = (ball.position.x - paddle.position.x) / (paddleWidth/2);
    const horizontal = Math.max(-.85, Math.min(.85, offset));
    const vx = horizontal * speed;
    const vy = Math.sqrt(Math.max(1.5, speed*speed - vx*vx));

    velocity.set(vx, vy);
    soundRelease();
}

/* =========================================================
   GAME UPDATE LOOP
========================================================= */
function update(delta){
    if(!running || isPaused){
        return;
    }

    // Process ball trail
    updateBallTrail(delta);

    /* ======================
       KEYBOARD CONTROLS
    ====================== */
    let direction = 0;
    if(keyboardLeft){ direction--; }
    if(keyboardRight){ direction++; }

    paddle.position.x += direction * 9 * delta;
    paddle.position.x = Math.max(
        -WORLD_WIDTH/2 + paddleWidth/2,
        Math.min(WORLD_WIDTH/2 - paddleWidth/2, paddle.position.x)
    );

    /* ======================
       WIDE TIMER
    ====================== */
    if(wideTimer > 0){
        wideTimer -= delta;
        if(wideTimer <= 0){
            wideTimer = 0;
            setPaddleWidth(BASE_PADDLE_WIDTH);
        }
    }

    /* ======================
       MAGNET TIMER
    ====================== */
    if(magnetTimer > 0){
        magnetTimer -= delta;
        if(magnetTimer <= 0){
            magnetTimer = 0;
            if(magnetAttached){
                releaseMagnet();
            }
        }
    }

    updateHUD();

    /* =====================================================
       MAGNET BALL ATTACHMENT
    ===================================================== */
    if(magnetAttached){
        ball.position.x = paddle.position.x;
        ball.position.y = paddle.position.y + .55;
    } else {
        ball.position.x += velocity.x * delta;
        ball.position.y += velocity.y * delta;
    }

    /* ======================
       WALL COLLISION
    ====================== */
    const limitX = WORLD_WIDTH/2 - BALL_RADIUS;
    const limitY = WORLD_HEIGHT/2 - BALL_RADIUS;

    if(ball.position.x < -limitX){
        ball.position.x = -limitX;
        velocity.x = Math.abs(velocity.x);
        soundWall();
    }

    if(ball.position.x > limitX){
        ball.position.x = limitX;
        velocity.x = -Math.abs(velocity.x);
        soundWall();
    }

    if(ball.position.y > limitY){
        ball.position.y = limitY;
        velocity.y = -Math.abs(velocity.y);
        soundWall();
    }

    /* ======================
       PADDLE COLLISION
    ====================== */
    if(
        !magnetAttached &&
        velocity.y < 0 &&
        ball.position.y < paddle.position.y + .5 &&
        ball.position.y > paddle.position.y - .5 &&
        circleRectangleCollision(
            ball.position.x,
            ball.position.y,
            BALL_RADIUS,
            paddle.position.x,
            paddle.position.y,
            paddleWidth,
            .42
        )
    ){
        ball.position.y = paddle.position.y + .5;
        const relative = (ball.position.x - paddle.position.x) / (paddleWidth/2);
        const speed = Math.max(5, velocity.length());
        const vx = relative * speed * .9;
        const vy = Math.sqrt(Math.max(1, speed*speed - vx*vx));

        velocity.set(vx, vy);
        soundPaddle();

        if(magnetTimer > 0){
            magnetAttached = true;
            sound(520, .12, "sine", .045, 850);
        }
    }

    /* ======================
       BRICK COLLISION
    ====================== */
    for(const brick of bricks){
        if(!brick.alive){ continue; }

        if(
            circleRectangleCollision(
                ball.position.x,
                ball.position.y,
                BALL_RADIUS,
                brick.mesh.position.x,
                brick.mesh.position.y,
                BRICK_WIDTH,
                BRICK_HEIGHT
            )
        ){
            const dx = ball.position.x - brick.mesh.position.x;
            const dy = ball.position.y - brick.mesh.position.y;

            if(Math.abs(dx) > Math.abs(dy)){
                velocity.x *= -1;
            } else {
                velocity.y *= -1;
            }

            hitBrick(brick);
            break;
        }
    }

    /* ======================
       BALL LOST
    ====================== */
    if(ball.position.y < -WORLD_HEIGHT/2 - .6){
        lives--;
        soundLose();

        if(lives <= 0){
            running = false;
            document.getElementById("overlay").classList.remove("hidden");
            document.querySelector(".logo").textContent = t.gameOver;
            document.getElementById("message").innerHTML =
                t.finalScore + "<b>" + score + "</b><br><br>" + t.beatenRecord;
            document.getElementById("start").textContent = t.btnRestart;
        } else {
            resetRound();
        }
        updateHUD();
    }

    /* ======================
       BRICK PARTICLES
    ====================== */
    for(let i = particles.length - 1; i >= 0; i--){
        const particle = particles[i];
        particle.life -= delta;
        particle.mesh.position.addScaledVector(particle.velocity, delta);
        particle.mesh.scale.setScalar(Math.max(0, particle.life * 2));

        if(particle.life <= 0){
            scene.remove(particle.mesh);
            particle.mesh.geometry.dispose();
            particle.mesh.material.dispose();
            particles.splice(i, 1);
        }
    }
}

/* =========================================================
   SWIPE / DRAG CONTROLS
========================================================= */
let dragging = false;
let lastTouchX = 0;
let swipeDistance = 0;

renderer.domElement.addEventListener("pointerdown", event => {
    if(isPaused) return;
    dragging = true;
    lastTouchX = event.clientX;
    swipeDistance = 0;
    try{
        renderer.domElement.setPointerCapture(event.pointerId);
    } catch(e){}
});

renderer.domElement.addEventListener("pointermove", event => {
    if(!dragging || isPaused){ return; }

    const deltaX = event.clientX - lastTouchX;
    swipeDistance += Math.abs(deltaX);

    paddle.position.x += (deltaX / renderer.domElement.clientWidth) * WORLD_WIDTH;
    paddle.position.x = Math.max(
        -WORLD_WIDTH/2 + paddleWidth/2,
        Math.min(WORLD_WIDTH/2 - paddleWidth/2, paddle.position.x)
    );

    if(magnetAttached && swipeDistance >= 18){
        releaseMagnet();
        swipeDistance = 0;
    }

    lastTouchX = event.clientX;
});

renderer.domElement.addEventListener("pointerup", () => {
    dragging = false;
    swipeDistance = 0;
});

renderer.domElement.addEventListener("pointercancel", () => {
    dragging = false;
    swipeDistance = 0;
});

/* =========================================================
   KEYBOARD & HOTKEYS
========================================================= */
window.addEventListener("keydown", event => {
    if(event.key === "ArrowLeft" || event.key === "a" || event.key === "A"){
        keyboardLeft = true;
    }
    if(event.key === "ArrowRight" || event.key === "d" || event.key === "D"){
        keyboardRight = true;
    }
    if(event.code === "Space" && magnetAttached){
        event.preventDefault();
        releaseMagnet();
    }
    // Pause hotkey
    if(event.key === "p" || event.key === "P") {
        event.preventDefault();
        togglePause();
    }
});

window.addEventListener("keyup", event => {
    if(event.key === "ArrowLeft" || event.key === "a" || event.key === "A"){
        keyboardLeft = false;
    }
    if(event.key === "ArrowRight" || event.key === "d" || event.key === "D"){
        keyboardRight = false;
    }
});

/* =========================================================
   START / RESTART GAME
========================================================= */
document.getElementById("start").addEventListener("click", () => {
    initAudio();
    soundStart();

    score = 0;
    level = 1;
    lives = 3;
    magnetTimer = 0;
    magnetAttached = false;
    isPaused = false;
    running = true;

    // Make sure pause overlay is hidden
    document.getElementById("pause-overlay").classList.add("hidden");
    document.getElementById("pause").textContent = "⏸️";

    document.getElementById("overlay").classList.add("hidden");
    document.querySelector(".logo").textContent = "BREAKOUT 3D";
    document.getElementById("message").innerHTML = t.instructions;
    document.getElementById("start").textContent = t.btnStart;

    createBricks();
    resetRound();
    updateHUD();
});

/* =========================================================
   RESPONSIVE CANVAS
========================================================= */
function resizeGame(){
    const screenAspect = window.innerWidth / window.innerHeight;
    const gameAspect = WORLD_WIDTH / WORLD_HEIGHT;

    let viewWidth;
    let viewHeight;

    if(screenAspect >= gameAspect){
        viewHeight = WORLD_HEIGHT + 1.3;
        viewWidth = viewHeight * screenAspect;
    } else {
        viewWidth = WORLD_WIDTH + 1.3;
        viewHeight = viewWidth / screenAspect;
    }

    camera.left = -viewWidth/2;
    camera.right = viewWidth/2;
    camera.top = viewHeight/2;
    camera.bottom = -viewHeight/2;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}

window.addEventListener("resize", resizeGame);
window.addEventListener("orientationchange", () => {
    setTimeout(resizeGame, 150);
});

/* =========================================================
   INITIALIZATION
========================================================= */
resizeGame();
createBricks();
resetRound();
updateHUD();

/* =========================================================
   GAME LOOP
========================================================= */
let previousTime = performance.now();

function gameLoop(currentTime){
    requestAnimationFrame(gameLoop);

    const delta = Math.min((currentTime - previousTime) / 1000, .033);
    previousTime = currentTime;

    update(delta);
    processBallTrail(delta); // Fade out and clean trail particles
    renderer.render(scene, camera);
}

requestAnimationFrame(gameLoop);

</script>
