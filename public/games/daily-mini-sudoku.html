<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>لعبة سودوكو المصغرة اليومية | mini sudoku online</title>
  <meta name="description" content="العب لعبة mini sudoku online اليومية الكلاسيكية والمصغرة مجاناً أون لاين وبدون تحميل! درب عقلك وحل ألغاز سودوكو مميزة وسهلة الاستخدام مباشرة في المتصفح." />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1220;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container" style="width: 100%; height: 100%;">
      <iframe 
        src="https://cdn.htmlgames.com/DailyMiniSudoku/index.html" 
        style="width: 100%; height: 100%; border: none; border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);" 
        allow="autoplay; fullscreen; keyboard; gamepad" 
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock"
        referrerpolicy="no-referrer"
      ></iframe>
    </div>
  </div>
</body>
</html>
